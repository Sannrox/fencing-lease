[package]
name = "fencing-lease"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
description = "Named fencing leases for standalone engines"
publish = false
repository = "https://github.com/Sannrox/fencing-lease"

[features]
default = []
postgres = ["dep:postgres"]
kubernetes = ["dep:ureq", "dep:time"]

[dependencies]
postgres = { version = "0.19", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["formatting", "parsing"], optional = true }
ureq = { version = "2.12", default-features = false, features = ["json", "tls"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev.package."*"]
debug = false

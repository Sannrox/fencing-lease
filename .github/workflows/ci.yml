name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: fencing-lease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --features postgres,kubernetes
      - run: cargo clippy --locked --all-targets --features postgres,kubernetes -- -D warnings

  release-scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - run: bash scripts/validate-release.sh
